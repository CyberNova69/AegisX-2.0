# AegisX ingestion foundation — Phase 1 configuration
# Format: flat key: value (pyyaml is used if available, otherwise this built-in parser).

# Recurse into subdirectories when given a directory.
recursive: true

# Hard cap on total canonical events produced in one run (None = unlimited).
max_records: null

# Per-file record cap (None = no per-file limit). Useful for sampling huge sources.
limit_per_file: null

# Formats the pipeline is allowed to ingest.
enabled_formats: [csv, json, jsonl, xml, text_log, excel, parquet]
