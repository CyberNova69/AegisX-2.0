# AegisX Data Platform Configuration
# ====================================

sources:
  cicids:
    url: "https://www.unb.ca/cic/datasets/ids-2017.html"
    cache_dir: "datasets/external/cache/cicids"
    enabled: true

  unsw_nb15:
    url: "https://research.unsw.edu.au/projects/unsw-nb15-dataset"
    cache_dir: "datasets/external/cache/unsw_nb15"
    enabled: true

  ctu13:
    url: "https://www.stratosphereips.org/datasets-ctu13"
    cache_dir: "datasets/external/cache/ctu13"
    enabled: true

  ember:
    url: "https://github.com/elastic/ember"
    cache_dir: "datasets/external/cache/ember"
    enabled: true

  mitre_attack:
    url: "https://raw.githubusercontent.com/mitre/cti/master/enterprise-attack/enterprise-attack.json"
    cache_dir: "datasets/external/cache/mitre"
    enabled: true

processing:
  dedup_strategy: "exact"
  validation_strict: true
  enrichment:
    mitre_mapping: true
    geo_ip: false

sft:
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  max_examples: null
  balance_strategy: "oversample_minority"
  seed: 42
  protected_test_path: "datasets/finetuning/v1.0/test.jsonl"

training:
  inherit_from: "finetuning/config.yaml"
  model_name: "unsloth/Qwen2.5-7B-Instruct-bnb-4bit"
  method: "qlora"
  epochs: 3
  learning_rate: 0.0002
  batch_size: 4
  seed: 42

label_maps_dir: "configs/label_maps"

output:
  base_dir: "datasets/external"
  models_dir: "models"
  reports_dir: "reports/data_platform"
  registry_file: "models/registry.json"
  runs_dir: "runs"
