# AegisX RAG & Threat Intelligence Configuration
# ===============================================
# Configuration settings for document ingestion, chunking, and CPU-safe retrieval.

retrieval:
  top_k: 3
  similarity_threshold: 0.05
  algorithm: "bm25"  # Options: "bm25", "tfidf"

chunking:
  chunk_size: 400
  chunk_overlap: 50

knowledge_base:
  mitre_reference_path: "datasets/metadata/mitre_reference.json"
  auto_ingest: true
